[package]
name = "lanpaster"
version = "0.7.11"
edition = "2021"
rust-version = "1.80"
description = "LAN clipboard sync tool"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
arc-swap = "1"
bincode = { version = "2", features = ["derive"] }
clipboard-rs = { version = "0.3.5", features = ["image"] }
dirs = "6"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
hostname = "0.4"
mdns-sd = "0.21"
if-addrs = "0.15"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
snow = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "fs", "signal"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
winit = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSMenuItem", "NSMenu", "NSResponder", "NSRunningApplication", "NSScreen", "NSEvent", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
